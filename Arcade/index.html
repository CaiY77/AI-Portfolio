<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .title {
      font-size: clamp(28px, 6vw, 56px);
      color: #0ff;
      text-shadow: 0 0 10px #0ff, 0 0 30px #0ff, 0 0 60px #0ff;
      letter-spacing: 6px;
      margin-bottom: 12px;
      animation: flicker 4s infinite;
    }

    .subtitle {
      font-size: 10px;
      color: #f0f;
      text-shadow: 0 0 8px #f0f;
      margin-bottom: 60px;
      letter-spacing: 3px;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
      99% { opacity: 1; }
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      max-width: 1000px;
      width: 100%;
    }

    .game-card {
      background: #0d0d2b;
      border: 2px solid #0ff;
      border-radius: 4px;
      padding: 30px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px #0ff4, inset 0 0 20px #0ff1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .game-card:hover {
      background: #111133;
      border-color: #f0f;
      box-shadow: 0 0 20px #f0f8, inset 0 0 30px #f0f2;
      transform: translateY(-4px);
    }

    .game-icon {
      width: 100px;
      height: 100px;
    }

    .game-name {
      font-size: 13px;
      color: #ffe;
      text-shadow: 0 0 6px #ffe;
      line-height: 1.8;
    }

    .game-desc {
      font-size: 7px;
      color: #889;
      line-height: 2;
    }

    .play-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 10px 20px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
      text-shadow: 0 0 6px #0ff;
      box-shadow: 0 0 8px #0ff4;
    }

    .game-card:hover .play-btn {
      background: #f0f2;
      border-color: #f0f;
      color: #f0f;
      text-shadow: 0 0 6px #f0f;
      box-shadow: 0 0 12px #f0f6;
    }

    footer {
      margin-top: 60px;
      font-size: 7px;
      color: #445;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="title">ARCADE</div>
  <div class="subtitle">INSERT COIN TO PLAY</div>

  <div class="games-grid">

    <a class="game-card" href="tictactoe.html">
      <svg class="game-icon" viewBox="0 0 100 100">
        <line x1="33" y1="5" x2="33" y2="95" stroke="#0ff" stroke-width="4"/>
        <line x1="67" y1="5" x2="67" y2="95" stroke="#0ff" stroke-width="4"/>
        <line x1="5" y1="33" x2="95" y2="33" stroke="#0ff" stroke-width="4"/>
        <line x1="5" y1="67" x2="95" y2="67" stroke="#0ff" stroke-width="4"/>
        <line x1="10" y1="10" x2="26" y2="26" stroke="#f55" stroke-width="4" stroke-linecap="round"/>
        <line x1="26" y1="10" x2="10" y2="26" stroke="#f55" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="10" stroke="#5af" stroke-width="4" fill="none"/>
        <line x1="75" y1="58" x2="91" y2="42" stroke="#f55" stroke-width="4" stroke-linecap="round"/>
        <line x1="75" y1="42" x2="91" y2="58" stroke="#f55" stroke-width="4" stroke-linecap="round"/>
        <circle cx="17" cy="83" r="10" stroke="#5af" stroke-width="4" fill="none"/>
        <circle cx="83" cy="17" r="10" stroke="#5af" stroke-width="4" fill="none"/>
      </svg>
      <div class="game-name">TIC TAC TOE</div>
      <div class="game-desc">2 PLAYERS · 3 IN A ROW WINS</div>
      <button class="play-btn">PLAY</button>
    </a>

    <a class="game-card" href="connect4.html">
      <svg class="game-icon" viewBox="0 0 100 100">
        <rect x="5" y="25" width="90" height="70" rx="4" fill="#224" stroke="#0ff" stroke-width="2"/>
        <circle cx="19" cy="39" r="9" fill="#f55" opacity="0.9"/>
        <circle cx="36" cy="39" r="9" fill="#224" stroke="#556" stroke-width="1"/>
        <circle cx="53" cy="39" r="9" fill="#ff0" opacity="0.9"/>
        <circle cx="70" cy="39" r="9" fill="#f55" opacity="0.9"/>
        <circle cx="87" cy="39" r="9" fill="#224" stroke="#556" stroke-width="1"/>
        <circle cx="19" cy="57" r="9" fill="#224" stroke="#556" stroke-width="1"/>
        <circle cx="36" cy="57" r="9" fill="#ff0" opacity="0.9"/>
        <circle cx="53" cy="57" r="9" fill="#f55" opacity="0.9"/>
        <circle cx="70" cy="57" r="9" fill="#ff0" opacity="0.9"/>
        <circle cx="87" cy="57" r="9" fill="#224" stroke="#556" stroke-width="1"/>
        <circle cx="19" cy="75" r="9" fill="#ff0" opacity="0.9"/>
        <circle cx="36" cy="75" r="9" fill="#f55" opacity="0.9"/>
        <circle cx="53" cy="75" r="9" fill="#ff0" opacity="0.9"/>
        <circle cx="70" cy="75" r="9" fill="#f55" stroke="#f0f" stroke-width="2" opacity="1"/>
        <circle cx="87" cy="75" r="9" fill="#ff0" opacity="0.9"/>
        <polygon points="50,5 38,22 62,22" fill="#0ff" opacity="0.8"/>
      </svg>
      <div class="game-name">CONNECT 4</div>
      <div class="game-desc">2 PLAYERS · 4 IN A ROW WINS</div>
      <button class="play-btn">PLAY</button>
    </a>

    <a class="game-card" href="dotsandboxes.html">
      <svg class="game-icon" viewBox="0 0 100 100">
        <rect x="15" y="15" width="30" height="30" fill="#f558" stroke="none"/>
        <rect x="55" y="55" width="30" height="30" fill="#5af8" stroke="none"/>
        <circle cx="15" cy="15" r="4" fill="#0ff"/>
        <circle cx="45" cy="15" r="4" fill="#0ff"/>
        <circle cx="75" cy="15" r="4" fill="#0ff"/>
        <circle cx="15" cy="45" r="4" fill="#0ff"/>
        <circle cx="45" cy="45" r="4" fill="#0ff"/>
        <circle cx="75" cy="45" r="4" fill="#0ff"/>
        <circle cx="15" cy="75" r="4" fill="#0ff"/>
        <circle cx="45" cy="75" r="4" fill="#0ff"/>
        <circle cx="75" cy="75" r="4" fill="#0ff"/>
        <line x1="15" y1="15" x2="45" y2="15" stroke="#f55" stroke-width="3"/>
        <line x1="45" y1="15" x2="75" y2="15" stroke="#5af" stroke-width="3"/>
        <line x1="15" y1="45" x2="45" y2="45" stroke="#f55" stroke-width="3"/>
        <line x1="45" y1="45" x2="75" y2="45" stroke="#f55" stroke-width="3"/>
        <line x1="15" y1="75" x2="45" y2="75" stroke="#5af" stroke-width="3"/>
        <line x1="45" y1="75" x2="75" y2="75" stroke="#5af" stroke-width="3"/>
        <line x1="15" y1="15" x2="15" y2="45" stroke="#f55" stroke-width="3"/>
        <line x1="45" y1="15" x2="45" y2="45" stroke="#f55" stroke-width="3"/>
        <line x1="75" y1="15" x2="75" y2="45" stroke="#5af" stroke-width="3"/>
        <line x1="15" y1="45" x2="15" y2="75" stroke="#5af" stroke-width="3"/>
        <line x1="45" y1="45" x2="45" y2="75" stroke="#5af" stroke-width="3"/>
        <line x1="75" y1="45" x2="75" y2="75" stroke="#5af" stroke-width="3"/>
      </svg>
      <div class="game-name">DOTS & BOXES</div>
      <div class="game-desc">2 PLAYERS · CLAIM THE MOST BOXES</div>
      <button class="play-btn">PLAY</button>
    </a>

  </div>

  <footer>© ARCADE · ALL RIGHTS RESERVED</footer>

</body>
</html>
