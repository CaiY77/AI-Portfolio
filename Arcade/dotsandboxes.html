<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots & Boxes</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .back-btn {
      align-self: flex-start;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 8px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      text-decoration: none;
      text-shadow: 0 0 6px #0ff;
      box-shadow: 0 0 8px #0ff4;
      transition: all 0.2s;
      margin-bottom: 30px;
    }
    .back-btn:hover { border-color: #f0f; color: #f0f; text-shadow: 0 0 6px #f0f; }

    h1 {
      font-size: clamp(14px, 3.5vw, 24px);
      color: #0ff;
      text-shadow: 0 0 10px #0ff, 0 0 30px #0ff;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .scoreboard {
      display: flex;
      gap: 30px;
      margin-bottom: 16px;
      font-size: 9px;
    }

    .score-block {
      text-align: center;
      padding: 10px 20px;
      border: 2px solid #333;
      border-radius: 4px;
    }
    .score-block.p1 { border-color: #f55; color: #f55; text-shadow: 0 0 6px #f55; }
    .score-block.p2 { border-color: #5af; color: #5af; text-shadow: 0 0 6px #5af; }
    .score-label { font-size: 7px; margin-bottom: 6px; opacity: 0.8; }
    .score-value { font-size: 18px; }

    .status {
      font-size: 10px;
      margin-bottom: 20px;
      min-height: 20px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px currentColor;
    }

    .hint {
      font-size: 7px;
      color: #556;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    /* Canvas-based board */
    canvas {
      cursor: pointer;
      display: block;
      margin-bottom: 24px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 12px 24px;
      cursor: pointer;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #0ff;
      box-shadow: 0 0 8px #0ff4;
      transition: all 0.2s;
    }
    .btn:hover { border-color: #f0f; color: #f0f; text-shadow: 0 0 6px #f0f; box-shadow: 0 0 12px #f0f6; }

    .legend {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      font-size: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
    .legend-dot.p1 { background: #f55; box-shadow: 0 0 6px #f55; }
    .legend-dot.p2 { background: #5af; box-shadow: 0 0 6px #5af; }
  </style>
</head>
<body>

  <a class="back-btn" href="index.html">◄ ARCADE</a>
  <h1>DOTS & BOXES</h1>

  <div class="scoreboard">
    <div class="score-block p1">
      <div class="score-label">PLAYER 1</div>
      <div class="score-value" id="score-p1">0</div>
    </div>
    <div class="score-block p2">
      <div class="score-label">PLAYER 2</div>
      <div class="score-value" id="score-p2">0</div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="hint">CLICK A LINE BETWEEN DOTS TO CLAIM IT</div>

  <canvas id="canvas"></canvas>

  <button class="btn" id="reset-btn">NEW GAME</button>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot p1"></div><span style="color:#f55">PLAYER 1</span></div>
    <div class="legend-item"><div class="legend-dot p2"></div><span style="color:#5af">PLAYER 2</span></div>
  </div>

  <script src="js/human.js"></script>

</body>
</html>
